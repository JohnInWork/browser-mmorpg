<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMORPG — мужской и женский (тест)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#13151c;color:#eee;padding:24px;}
  h1{font-size:21px;margin-bottom:4px;} p.sub{color:#8a90a0;margin-bottom:20px;font-size:14px;max-width:820px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1000px;}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:#1c2030;border:1px solid #2c3142;border-radius:14px;padding:8px 6px 10px;text-align:center;}
  .stage{background:radial-gradient(ellipse at 50% 84%,#3a4250 0%,#1a1e28 72%);border-radius:10px;overflow:hidden;}
  .name{font-size:12px;font-weight:600;margin-top:6px;}
</style>
</head>
<body>
  <h1>Мужской и женский — руки/ноги толще</h1>
  <p class="sub">Доработка №3: конечности шире (лучше читаются в игре). Мужской — плечистее, короткие волосы. Женский — уже плечи, талия/бёдра, длинные волосы. Показаны базовые и в броне (заглушки), чтобы видеть и тело, и что слои брони ложатся для обоих.</p>
  <div class="grid" id="grid"></div>
<script>
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const t=p<0?0:255,a=Math.abs(p)/100;r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
let UID=0;
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return `M${x+r} ${y} h${w-2*r} a${r} ${r} 0 0 1 ${r} ${r} v${h-2*r} a${r} ${r} 0 0 1 ${-r} ${r} h${-(w-2*r)} a${r} ${r} 0 0 1 ${-r} ${-r} v${-(h-2*r)} a${r} ${r} 0 0 1 ${r} ${-r} z`;}
function rrBottom(x,y,w,h,r){return `M${x} ${y} h${w} v${h-r} a${r} ${r} 0 0 1 ${-r} ${r} h${-(w-2*r)} a${r} ${r} 0 0 1 ${-r} ${-r} z`;}
function ell(cx,cy,rx,ry){return `M${cx-rx} ${cy} a${rx} ${ry} 0 1 0 ${rx*2} 0 a${rx} ${ry} 0 1 0 ${-rx*2} 0 z`;}
const CX=110;

const MALE={ hcy:60,hrx:20,hry:23, neckY:79,neckW:8, shY:92,shHalf:40, midY:122,midHalf:34, waistY:150,hipHalf:32,
  armW:18,elbowX:50,elbowY:128,handX:48,handY:160, hipY:142,legW:22,legGap:5,feetY:256,bootH:17, longHair:false };
const FEMALE={ hcy:59,hrx:18,hry:22, neckY:78,neckW:7, shY:93,shHalf:31, midY:120,midHalf:23, waistY:150,hipHalf:31,
  armW:16,elbowX:44,elbowY:128,handX:43,handY:160, hipY:142,legW:20,legGap:6,feetY:256,bootH:16, longHair:true };

function hero(G,eq){
  eq=eq||{}; let defs='',body='';
  const L=c=>shade(c,9), D=c=>shade(c,-20);
  function split(path,base){const id='cl'+(UID++);defs+=`<clipPath id="${id}"><path d="${path}"/></clipPath>`;body+=`<path d="${path}" fill="${L(base)}"/><g clip-path="url(#${id})"><rect x="${CX}" y="0" width="260" height="320" fill="${D(base)}"/></g>`;}
  const skin=eq.skin||'#f3cfa6', hair=eq.hair||'#6e4426', main=eq.main||'#3f7a45', leg=eq.leg||'#5a4636', boot=eq.boot||'#3f2a18', accent='#d6a93a';
  const legH=G.feetY-G.hipY;

  body+=`<ellipse cx="110" cy="${G.feetY+7}" rx="${G.shHalf+14}" ry="9" fill="rgba(0,0,0,.25)"/>`;

  if(eq.cloak){const c=eq.cloak;
    body+=`<path d="M${CX-G.shHalf+2} 96 L${CX-G.shHalf-12} ${G.feetY-10} Q${CX} ${G.feetY+6} ${CX+G.shHalf+12} ${G.feetY-10} L${CX+G.shHalf-2} 96 Z" fill="${L(c)}"/>`;
    body+=`<path d="M${CX} 96 L${CX+G.shHalf+12} ${G.feetY-10} Q${CX} ${G.feetY+6} ${CX} ${G.feetY+6} Z" fill="${D(c)}" opacity=".5"/>`;}

  // длинные волосы (сзади) — женский
  if(G.longHair && !eq.helmet){
    split(`M${CX-G.hrx-3} ${G.hcy} Q${CX-G.hrx-3} ${G.hcy-G.hry-5} ${CX} ${G.hcy-G.hry-5} Q${CX+G.hrx+3} ${G.hcy-G.hry-5} ${CX+G.hrx+3} ${G.hcy} L${CX+G.hrx+4} ${G.shY+20} Q${CX+G.hrx-2} ${G.shY+22} ${CX+G.hrx-5} ${G.hcy+10} L${CX-G.hrx+5} ${G.hcy+10} Q${CX-G.hrx+2} ${G.shY+22} ${CX-G.hrx-4} ${G.shY+20} Z`, hair);
  }

  // ноги (плоский верх, под туникой) + штаны
  const pLeg=eq.pants||leg;
  body+=`<path d="${rrBottom(CX-G.legGap-G.legW,G.hipY,G.legW,legH,7)}" fill="${L(pLeg)}"/>`;
  body+=`<path d="${rrBottom(CX+G.legGap,G.hipY,G.legW,legH,7)}" fill="${D(pLeg)}"/>`;
  // сапоги
  const bCol=eq.bootsArmor||boot;
  body+=`<path d="${rr(CX-G.legGap-G.legW-2,G.feetY-G.bootH,G.legW+5,G.bootH,6)}" fill="${L(bCol)}"/>`;
  body+=`<path d="${rr(CX+G.legGap-3,G.feetY-G.bootH,G.legW+5,G.bootH,6)}" fill="${D(bCol)}"/>`;

  // торс (с талией/бёдрами через Q)
  const t=`M${CX-G.shHalf} ${G.shY} L${CX-G.shHalf+7} ${G.shY-7} L${CX+G.shHalf-7} ${G.shY-7} L${CX+G.shHalf} ${G.shY} Q${CX+G.midHalf} ${G.midY} ${CX+G.hipHalf} ${G.waistY} L${CX-G.hipHalf} ${G.waistY} Q${CX-G.midHalf} ${G.midY} ${CX-G.shHalf} ${G.shY} Z`;
  split(t,main);
  if(eq.chest){ split(`M${CX-G.shHalf+4} ${G.shY-1} L${CX-G.shHalf+10} ${G.shY-8} L${CX+G.shHalf-10} ${G.shY-8} L${CX+G.shHalf-4} ${G.shY-1} Q${CX+G.midHalf-3} ${G.midY} ${CX+G.hipHalf-4} ${G.waistY-6} L${CX-G.hipHalf+4} ${G.waistY-6} Q${CX-G.midHalf+3} ${G.midY} ${CX-G.shHalf+4} ${G.shY-1} Z`, eq.chest);
    body+=`<line x1="${CX}" y1="${G.shY-1}" x2="${CX}" y2="${G.waistY-8}" stroke="${shade(eq.chest,-30)}" stroke-width="2"/>`; }
  // пояс
  body+=`<path d="${rr(CX-G.hipHalf-1,G.waistY-9,G.hipHalf*2+2,10,3)}" fill="${L(boot)}"/>`;
  body+=`<rect x="${CX-7}" y="${G.waistY-8}" width="14" height="8" fill="${accent}"/>`;

  // шея
  body+=`<rect x="${CX-G.neckW}" y="${G.neckY}" width="${G.neckW}" height="${G.shY-G.neckY+2}" fill="${L(skin)}"/><rect x="${CX}" y="${G.neckY}" width="${G.neckW}" height="${G.shY-G.neckY+2}" fill="${D(skin)}"/>`;

  // руки (толще) + кисти (+перчатки)
  body+=`<path d="M${CX-G.shHalf+6} ${G.shY+4} L${CX-G.elbowX} ${G.elbowY} L${CX-G.handX} ${G.handY}" fill="none" stroke="${L(main)}" stroke-width="${G.armW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  body+=`<path d="M${CX+G.shHalf-6} ${G.shY+4} L${CX+G.elbowX} ${G.elbowY} L${CX+G.handX} ${G.handY}" fill="none" stroke="${D(main)}" stroke-width="${G.armW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const handCol=eq.gloves||skin, hr=G.armW*0.62;
  body+=`<circle cx="${CX-G.handX}" cy="${G.handY}" r="${hr}" fill="${L(handCol)}"/><circle cx="${CX+G.handX}" cy="${G.handY}" r="${hr}" fill="${D(handCol)}"/>`;

  // голова + уши
  split(ell(CX,G.hcy,G.hrx,G.hry),skin);
  body+=`<circle cx="${CX-G.hrx}" cy="${G.hcy+2}" r="4.5" fill="${L(skin)}"/><circle cx="${CX+G.hrx}" cy="${G.hcy+2}" r="4.5" fill="${D(skin)}"/>`;
  // волосы (чёлка/шапка)
  if(!eq.helmet){ split(`M${CX-G.hrx} ${G.hcy-1} Q${CX-G.hrx} ${G.hcy-G.hry-3} ${CX} ${G.hcy-G.hry-3} Q${CX+G.hrx} ${G.hcy-G.hry-3} ${CX+G.hrx} ${G.hcy-1} Q${CX} ${G.hcy-G.hry+7} ${CX-G.hrx} ${G.hcy-1} Z`, hair); }

  // шлем
  if(eq.helmet){const hm=eq.helmet;
    split(`M${CX-G.hrx-1} ${G.hcy+1} Q${CX-G.hrx-1} ${G.hcy-G.hry-4} ${CX} ${G.hcy-G.hry-4} Q${CX+G.hrx+1} ${G.hcy-G.hry-4} ${CX+G.hrx+1} ${G.hcy+1} L${CX+G.hrx+1} ${G.hcy+4} L${CX-G.hrx-1} ${G.hcy+4} Z`, hm);
    body+=`<rect x="${CX-2}" y="${G.hcy-2}" width="4" height="${G.hry}" fill="${shade(hm,-28)}"/>`; }

  // топор
  if(eq.axe!==false){
    body+=`<line x1="${CX+G.handX}" y1="${G.handY+12}" x2="${CX+G.handX}" y2="${G.handY-44}" stroke="${shade('#7a5230',9)}" stroke-width="7" stroke-linecap="round"/>`;
    body+=`<path d="M${CX+G.handX} ${G.handY-46} q24 -3 28 16 q-14 6 -28 1 z" fill="#cfd6dd"/>`;
    body+=`<path d="M${CX+G.handX} ${G.handY-46} q24 -3 28 16 q-7 -14 -28 -16 z" fill="#9aa4b0"/>`;
  }
  return `<svg viewBox="0 0 220 300" width="210" height="286"><defs>${defs}</defs>${body}</svg>`;
}

const STEEL='#b9c2cd';
const CARDS=[
 {n:'Мужской — база', G:MALE, eq:{main:'#3f7a45'}},
 {n:'Мужской — в броне', G:MALE, eq:{main:'#3f7a45',helmet:STEEL,chest:STEEL,gloves:'#6a5236',pants:'#8c98a6',bootsArmor:'#6a6f7a'}},
 {n:'Женский — база', G:FEMALE, eq:{main:'#b0557a',hair:'#7a4a23'}},
 {n:'Женский — в броне', G:FEMALE, eq:{main:'#b0557a',hair:'#7a4a23',helmet:STEEL,chest:STEEL,gloves:'#6a5236',pants:'#8c98a6',bootsArmor:'#6a6f7a'}},
];
const grid=document.getElementById('grid');
CARDS.forEach(c=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="stage">${hero(c.G,c.eq)}</div><div class="name">${c.n}</div>`;grid.appendChild(el);});
</script>
</body>
</html>
