<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMORPG — стиль персонажа (flat, без лиц)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#13151c;color:#eee;padding:24px;}
  h1{font-size:22px;margin-bottom:4px;} p.sub{color:#8a90a0;margin-bottom:22px;font-size:14px;max-width:760px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;max-width:1200px;}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{background:#1c2030;border:1px solid #2c3142;border-radius:14px;padding:10px 8px 12px;text-align:center;}
  .stage{background:radial-gradient(ellipse at 50% 82%,#3a4250 0%,#1a1e28 72%);border-radius:10px;overflow:hidden;}
  .name{font-size:13px;font-weight:600;margin-top:8px;}
</style>
</head>
<body>
  <h1>Стиль из твоих референсов: flat, cel-тени, без лиц</h1>
  <p class="sub">Свет слева → правая половина темнее. Без градиентов, без обводок, без глаз/рта. №1 держит топор — доказательство, что экипировка рисуется отдельным слоем поверх.</p>
  <div class="grid" id="grid"></div>
<script>
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const t=p<0?0:255,a=Math.abs(p)/100;r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

let UID=0;
function flatChar(o){
  const CX=110; let defs='',body='';
  const L=(c)=>shade(c,9), D=(c)=>shade(c,-20);
  // деталь со сплит-тенью по центру (левая половина светлая, правая тёмная)
  function split(path, base){
    const id='cl'+(UID++);
    defs+=`<clipPath id="${id}"><path d="${path}"/></clipPath>`;
    body+=`<path d="${path}" fill="${L(base)}"/><g clip-path="url(#${id})"><rect x="${CX}" y="0" width="240" height="300" fill="${D(base)}"/></g>`;
  }
  const skin=o.skin, hair=o.hair, main=o.main, leg=o.leg||'#3a4450', boot=o.boot||'#5a3c20', accent=o.accent||'#d6a93a';

  // тень на земле
  body+=`<ellipse cx="110" cy="288" rx="58" ry="11" fill="rgba(0,0,0,.25)"/>`;

  // РУКИ (за торсом): левая светлая, правая тёмная
  body+=`<path d="M86 104 Q66 112 63 142 Q62 162 69 174" stroke="${L(main)}" stroke-width="19" fill="none" stroke-linecap="round"/>`;
  body+=`<path d="M134 104 Q154 112 157 142 Q158 162 151 174" stroke="${D(main)}" stroke-width="19" fill="none" stroke-linecap="round"/>`;
  // кисти
  body+=`<circle cx="69" cy="176" r="9" fill="${L(skin)}"/><circle cx="151" cy="176" r="9" fill="${D(skin)}"/>`;

  if(o.robe){
    // мантия (юбка) вместо ног
    split(`M74 100 Q74 92 92 90 L128 90 Q146 92 146 100 L168 280 Q110 292 52 280 Z`, main);
    body+=`<ellipse cx="92" cy="282" rx="10" ry="4" fill="${L(boot)}"/><ellipse cx="128" cy="282" rx="10" ry="4" fill="${D(boot)}"/>`;
  } else {
    // НОГИ: левая светлая, правая тёмная
    body+=`<rect x="89" y="166" width="22" height="100" rx="9" fill="${L(leg)}"/>`;
    body+=`<rect x="109" y="166" width="22" height="100" rx="9" fill="${D(leg)}"/>`;
    // БОТИНКИ
    body+=`<path d="M83 256 h28 v16 q0 8 -8 8 h-12 q-8 0 -8 -8 z" fill="${L(boot)}"/>`;
    body+=`<path d="M109 256 h28 v16 q0 8 -8 8 h-12 q-8 0 -8 -8 z" fill="${D(boot)}"/>`;
    // ТОРС
    split(`M76 100 Q74 92 92 90 L128 90 Q146 92 144 100 L150 172 Q110 182 70 172 Z`, main);
    // ПОЯС
    body+=`<rect x="70" y="166" width="80" height="12" rx="2" fill="${L(boot)}"/><g clip-path="url(#beltc)"></g>`;
    body+=`<rect x="102" y="167" width="16" height="10" rx="2" fill="${accent}"/>`;
    if(o.plate){ split(`M82 102 Q110 96 138 102 L134 150 Q110 158 86 150 Z`, shade(main,-6)); }
  }
  // вырез у шеи
  body+=`<path d="M100 92 L110 104 L120 92 Z" fill="${L(skin)}"/>`;

  // ШЕЯ
  body+=`<rect x="97" y="80" width="13" height="16" fill="${L(skin)}"/><rect x="110" y="80" width="13" height="16" fill="${D(skin)}"/>`;

  // волосы сзади (если длинные)
  if(o.longHair && !o.hood){ split(`M80 56 Q78 24 110 24 Q142 24 140 56 L146 110 Q132 104 128 78 Q120 52 110 52 Q100 52 92 78 Q88 104 74 110 Z`, hair); }

  // ГОЛОВА
  split(`M83 58 A27 31 0 0 1 137 58 A27 31 0 0 1 83 58 Z`, skin);
  // уши
  body+=`<circle cx="83" cy="60" r="6" fill="${L(skin)}"/><circle cx="137" cy="60" r="6" fill="${D(skin)}"/>`;

  if(o.hood){
    split(`M80 64 Q76 22 110 20 Q144 22 140 64 Q138 46 122 40 Q116 36 110 36 Q104 36 98 40 Q82 46 80 64 Z`, main);
  } else {
    // ВОЛОСЫ (чёлка/шапка) — без лица
    split(`M81 60 Q78 26 110 26 Q142 26 139 60 Q126 42 110 42 Q94 42 81 60 Z`, hair);
  }

  // ПРЕДМЕТ В РУКЕ (правая): топор / посох
  if(o.axe){
    body+=`<line x1="151" y1="188" x2="151" y2="112" stroke="${shade('#7a5230',9)}" stroke-width="8" stroke-linecap="round"/>`;
    body+=`<line x1="153" y1="188" x2="153" y2="112" stroke="${shade('#7a5230',-22)}" stroke-width="4" stroke-linecap="round" opacity=".6"/>`;
    body+=`<path d="M151 110 q26 -3 31 18 q-16 7 -31 1 z" fill="#cfd6dd"/>`;
    body+=`<path d="M151 110 q26 -3 31 18 l0 0 q-9 -16 -31 -18 z" fill="#9aa4b0"/>`;
  }
  if(o.staff){
    body+=`<line x1="69" y1="186" x2="69" y2="96" stroke="${shade('#7a5230',9)}" stroke-width="8" stroke-linecap="round"/>`;
    body+=`<circle cx="69" cy="92" r="11" fill="${L(accent)}"/><path d="M69 81 a11 11 0 0 1 0 22 z" fill="${D(accent)}"/>`;
  }

  return `<svg viewBox="0 0 220 300" width="180" height="245"><defs>${defs}</defs>${body}</svg>`;
}

const V=[
 {name:'Воин (с топором)', skin:'#f0c8a0',hair:'#5a3a22',main:'#9a4a2a',leg:'#6e4a2a',boot:'#4a3018',axe:true},
 {name:'Рыцарь',           skin:'#eec39a',hair:'#33303a',main:'#aeb7c4',leg:'#5a606c',boot:'#44484f',accent:'#e0b94a',plate:true},
 {name:'Маг',              skin:'#f0c8a0',hair:'#d8d8e0',main:'#5b46a8',accent:'#6fd0e0',robe:true,staff:true,longHair:true},
 {name:'Следопыт',         skin:'#e8bf94',hair:'#5a3a22',main:'#3f7a45',leg:'#6e4a2a',boot:'#4a3018',hood:true},
 {name:'Простолюдин',      skin:'#eec39a',hair:'#caa24a',main:'#9a7b4a',leg:'#6e5a3a',boot:'#5a3c20'},
 {name:'Базовый герой',    skin:'#f0c8a0',hair:'#5a3a22',main:'#4f7fc4',leg:'#3a4450',boot:'#5a3c20'},
];
const grid=document.getElementById('grid');
V.forEach((v,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="stage">${flatChar(v)}</div><div class="name">${i+1}. ${v.name}</div>`;grid.appendChild(c);});
</script>
</body>
</html>
