<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Доска объявлений (квесты с доски). Два столба + щит с приколотыми бумажками. -->
  <ellipse cx="256" cy="468" rx="120" ry="22" fill="#000000" fill-opacity="0.18"/>
  <!-- столбы -->
  <rect x="120" y="250" width="30" height="218" fill="#6e4520"/>
  <rect x="120" y="250" width="11" height="218" fill="#8c5b30"/>
  <rect x="362" y="250" width="30" height="218" fill="#6e4520"/>
  <rect x="362" y="250" width="11" height="218" fill="#8c5b30"/>
  <!-- рама щита -->
  <rect x="80" y="70" width="352" height="252" rx="16" fill="#5e3c1c"/>
  <rect x="94" y="84" width="324" height="224" rx="12" fill="#a9743f"/>
  <!-- горизонтальные доски настила -->
  <g stroke="#8a5a2c" stroke-width="5">
    <line x1="96" y1="150" x2="416" y2="150"/>
    <line x1="96" y1="226" x2="416" y2="226"/>
  </g>
  <!-- приколотые объявления (бумажки) -->
  <g>
    <rect x="122" y="108" width="120" height="92" rx="6" fill="#f3ead2" transform="rotate(-4 182 154)"/>
    <rect x="270" y="118" width="120" height="92" rx="6" fill="#eef0e2" transform="rotate(3 330 164)"/>
    <rect x="180" y="210" width="120" height="84" rx="6" fill="#f5efdc" transform="rotate(-2 240 252)"/>
  </g>
  <!-- «строки текста» на бумажках -->
  <g fill="#7d6a44">
    <rect x="138" y="126" width="86" height="9" rx="4" transform="rotate(-4 182 154)"/>
    <rect x="138" y="146" width="86" height="9" rx="4" transform="rotate(-4 182 154)"/>
    <rect x="138" y="166" width="56" height="9" rx="4" transform="rotate(-4 182 154)"/>
    <rect x="286" y="136" width="86" height="9" rx="4" transform="rotate(3 330 164)"/>
    <rect x="286" y="156" width="86" height="9" rx="4" transform="rotate(3 330 164)"/>
    <rect x="286" y="176" width="56" height="9" rx="4" transform="rotate(3 330 164)"/>
    <rect x="196" y="228" width="86" height="9" rx="4" transform="rotate(-2 240 252)"/>
    <rect x="196" y="248" width="70" height="9" rx="4" transform="rotate(-2 240 252)"/>
  </g>
  <!-- кнопки-гвоздики -->
  <g fill="#c0392b">
    <circle cx="182" cy="112" r="6"/>
    <circle cx="330" cy="124" r="6"/>
    <circle cx="240" cy="214" r="6"/>
  </g>
</svg>
