<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Табличка-доска объявлений (читаемое сообщение). НЕ дорожный знак. Заготовка. -->
  <ellipse cx="256" cy="452" rx="86" ry="20" fill="#000000" fill-opacity="0.18"/>
  <!-- столб -->
  <rect x="238" y="250" width="36" height="200" fill="#7a4d22"/>
  <rect x="238" y="250" width="14" height="200" fill="#9a6634"/>
  <!-- доска -->
  <rect x="96" y="96" width="320" height="190" rx="14" fill="#7a4d22"/>
  <rect x="108" y="108" width="296" height="166" rx="10" fill="#b07a42"/>
  <!-- доски настила (вертикальные швы) -->
  <g stroke="#9a6634" stroke-width="4">
    <line x1="206" y1="112" x2="206" y2="270"/>
    <line x1="306" y1="112" x2="306" y2="270"/>
  </g>
  <!-- «строки текста» -->
  <g fill="#5a3f1e">
    <rect x="138" y="140" width="236" height="16" rx="8"/>
    <rect x="138" y="172" width="236" height="16" rx="8"/>
    <rect x="138" y="204" width="170" height="16" rx="8"/>
  </g>
  <!-- гвозди по углам -->
  <g fill="#5a3f1e">
    <circle cx="126" cy="126" r="7"/>
    <circle cx="386" cy="126" r="7"/>
    <circle cx="126" cy="256" r="7"/>
    <circle cx="386" cy="256" r="7"/>
  </g>
</svg>
