<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Валун (декоративный, не добывается): гладкий гранёный камень + мох. Заготовка. -->
  <ellipse cx="256" cy="430" rx="156" ry="32" fill="#000000" fill-opacity="0.18"/>
  <!-- тело валуна -->
  <polygon points="120,360 100,250 180,170 320,160 410,240 400,360 256,420" fill="#9aa0aa"/>
  <!-- левая (тёмная) грань -->
  <polygon points="120,360 100,250 180,170 220,260 200,380 256,420" fill="#7a818c"/>
  <!-- верхний блик -->
  <polygon points="180,170 320,160 360,225 240,250" fill="#b3b9c2"/>
  <!-- трещина -->
  <path d="M250,250 L300,330 L280,380" stroke="#5f656f" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- мох на макушке -->
  <ellipse cx="262" cy="200" rx="58" ry="20" fill="#4f9e44"/>
  <ellipse cx="240" cy="196" rx="24" ry="10" fill="#63b653"/>
</svg>
