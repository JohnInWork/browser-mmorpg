<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Горы: плоские грани (cel), снежные шапки. Заготовка — перерисуй под себя. -->
  <ellipse cx="256" cy="452" rx="170" ry="30" fill="#000000" fill-opacity="0.16"/>
  <!-- задний пик -->
  <polygon points="372,196 300,452 470,452" fill="#5c636d"/>
  <polygon points="372,196 343,260 401,260" fill="#e3e9f0"/>
  <!-- передний пик: левая (светлая) и правая (тёмная) грань -->
  <polygon points="200,150 70,452 200,452" fill="#8a929c"/>
  <polygon points="200,150 200,452 330,452" fill="#6b727c"/>
  <!-- снежная шапка переднего пика -->
  <polygon points="200,150 150,238 178,224 200,256 224,220 252,242 270,224" fill="#ffffff"/>
  <polygon points="200,150 200,256 270,224 252,242 224,220 200,256" fill="#dde6ee"/>
</svg>
