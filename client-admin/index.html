<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG — Редактор карт (админ)</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <!-- Редактор (открывается сразу, без логина) -->
  <div id="editor">
    <div id="toolbar">
      <span class="title">Редактор</span>
      <span id="locTabs"></span>
      <label class="sid-lbl">Размер <input id="mapWInput" type="number" min="5" max="400" style="width:48px">×<input id="mapHInput" type="number" min="5" max="400" style="width:48px"></label>
      <label class="sid-lbl">Связь <input id="sidInput" type="text" value="1" style="width:80px" placeholder="напр. Лес"></label>
      <button id="saveBtn">Сохранить</button>
      <button id="contentBtn" title="Редактор предметов, цен и крафта">⚙ Предметы и крафт</button>
      <button id="boardBtn" title="Пул квестов для доски объявлений">📋 Доска</button>
      <span id="status"></span>
      <span class="hint">ЛКМ — рисовать · ПКМ — двигать · колесо — зум · лестницы связываются по «ID связи»</span>
    </div>
    <div id="workArea">
      <aside id="paletteDock">
        <div id="palHead">
          <input id="palSearch" type="text" placeholder="Поиск… (трава, руда, моб)">
          <button id="palCollapse" title="Свернуть панель">‹</button>
        </div>
        <div id="palette"></div>
      </aside>
      <canvas id="canvas"></canvas>
      <div id="palTools"></div>
    </div>
  </div>

  <!-- Оверлей конструктора НПС (наполняется из editor.js) -->
  <div id="npcOverlay" class="npc-overlay hidden"></div>
  <!-- Оверлей редактора предметов и крафта -->
  <div id="contentOverlay" class="npc-overlay hidden"></div>
  <!-- Оверлей редактора доски объявлений -->
  <div id="boardOverlay" class="npc-overlay hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="editor.js?v=56"></script>
</body>
</html>
