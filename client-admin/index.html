<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG — Редактор карт (админ)</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Редактор (открывается сразу, без логина) -->
  <div id="editor">
    <div id="toolbar">
      <span class="title">Редактор</span>
      <span id="locTabs"></span>
      <div id="palette"></div>
      <label class="sid-lbl">ID связи <input id="sidInput" type="number" value="1" min="1" style="width:54px"></label>
      <button id="saveBtn">Сохранить</button>
      <span id="status"></span>
      <span class="hint">ЛКМ — рисовать · ПКМ — двигать · колесо — зум · лестницы связываются по «ID связи»</span>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="editor.js?v=3"></script>
</body>
</html>
