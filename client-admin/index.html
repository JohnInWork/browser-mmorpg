<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG — Редактор карт (админ)</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <!-- Редактор (открывается сразу, без логина) -->
  <div id="editor">
    <div id="toolbar">
      <span class="title">Редактор</span>
      <span id="locTabs"></span>
      <div id="palette"></div>
      <label class="sid-lbl">Размер <input id="mapWInput" type="number" min="5" max="60" style="width:48px">×<input id="mapHInput" type="number" min="5" max="60" style="width:48px"></label>
      <label class="sid-lbl">Связь <input id="sidInput" type="text" value="1" style="width:80px" placeholder="напр. Лес"></label>
      <button id="saveBtn">Сохранить</button>
      <span id="status"></span>
      <span class="hint">ЛКМ — рисовать · ПКМ — двигать · колесо — зум · лестницы связываются по «ID связи»</span>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <!-- Оверлей конструктора НПС (наполняется из editor.js) -->
  <div id="npcOverlay" class="npc-overlay hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="editor.js?v=9"></script>
</body>
</html>
